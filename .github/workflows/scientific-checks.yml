name: Scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      README_ENTRY: 'README.md'
      MIN_EXPECTED_PYTHON_SOURCES: '15'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check supplied source and documentation
        shell: bash
        run: |
          set -euo pipefail
          python -B .github/scripts/check_repository.py \
            2>&1 | tee "$RUNNER_TEMP/p075-material-check.log"
      - name: Check bounded failure accounting against independent public oracle
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 3145728
          ulimit -t 115
          timeout --signal=TERM --kill-after=10s 120s \
            python -B tests/failure_regression.py \
            2>&1 | tee "$RUNNER_TEMP/p075-failure-regression.log"
      - name: Reconstruct and verify all finite evidence without resume
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p075-evidence"
          ulimit -v 3145728
          ulimit -t 1180
          timeout --signal=TERM --kill-after=10s 1200s \
            python -B reproduce.py --output "$RUNNER_TEMP/p075-evidence" \
            2>&1 | tee "$RUNNER_TEMP/p075-whole-run.log"
      - name: Upload raw output and finite evidence on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p075-scientific-output
          path: |
            ${{ runner.temp }}/p075-evidence/
            ${{ runner.temp }}/p075-whole-run.log
            ${{ runner.temp }}/p075-material-check.log
            ${{ runner.temp }}/p075-failure-regression.log
          if-no-files-found: warn
          retention-days: 14
